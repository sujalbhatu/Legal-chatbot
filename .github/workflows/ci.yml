# Runs on every push and pull request: Node API tests, RAG unit tests, and the
# frontend's lint, tests and production build.
name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/server/package-lock.json
      - run: npm ci
      - run: npm test

  rag:
    name: RAG service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/rag_model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/rag_model/requirements.txt
      # The unit tests stub the models and the vector store, so the heavy packages
      # (torch, sentence-transformers, chromadb, fasttext) are not needed here.
      - run: >
          pip install flask==3.1.3 python-dotenv==1.2.2 rank-bm25==0.2.2 PyPDF2==3.0.1
          requests==2.33.1 beautifulsoup4==4.14.3 lxml==6.1.0 numpy==2.4.4 groq==1.2.0
      - run: python -m unittest discover -s tests

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
